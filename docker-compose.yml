services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    # -sharedDb: one database file regardless of credentials/region; the volume keeps data between restarts.
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    user: root
    ports:
      - "8000:8000"
    volumes:
      - ddbdata:/data
    healthcheck:
      # The image has no curl/wget; a TCP connect is enough to know the port is up.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    build: .
    environment:
      DYNAMODB_TABLE: job-tracker
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
    ports:
      - "8080:3000"
    depends_on:
      dynamodb:
        condition: service_healthy

volumes:
  ddbdata:
