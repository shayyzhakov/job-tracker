<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1b1e" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the stored/OS color scheme before first paint to avoid a white flash in dark mode.
      (() => {
        try {
          const s = localStorage.getItem('mantine-color-scheme-value');
          const dark = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-mantine-color-scheme', dark ? 'dark' : 'light');
        } catch (_e) {}
      })();
    </script>
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Job Tracker</title>
    <script>
      // Local development (localhost / 127.0.0.1 / [::1] / *.localhost) gets a "DEV" title and an amber favicon,
      // so it is easy to tell apart from the real deployment. Runs before first paint.
      (() => {
        try {
          const h = location.hostname;
          const local = h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || h.endsWith('.localhost');
          if (!local) return;
          document.title = 'DEV · Job Tracker';
          document.getElementById('favicon').setAttribute('href', '/favicon-dev.svg');
        } catch (_e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
