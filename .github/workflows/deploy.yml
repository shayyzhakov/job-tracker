# Deploys code + infrastructure to AWS after the quality gate passes.
#
# Security model (the repository is public):
#  - Runs only on pushes to `main`, and `main` is protected: changes land through reviewed pull requests.
#  - No stored AWS keys. The job exchanges a short-lived GitHub OIDC token for AWS credentials; the IAM role
#    (infra/bootstrap/github-oidc.tf) trusts only this repo's `production` environment.
#  - The `production` environment requires manual approval and is limited to the `main` branch.
# One-time setup: see "CI/CD" in infra/README.md.
name: deploy
on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # needed to request the OIDC token; grants nothing by itself
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.10.x
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: pnpm install --frozen-lockfile
      - name: Write tfvars
        env:
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
        run: echo "owner_email = \"$OWNER_EMAIL\"" > infra/envs/prod/terraform.tfvars
      # Tests ran in the `ci` job; --yes because approving the `production` environment is the gate.
      - run: scripts/deploy.sh --skip-tests --yes
