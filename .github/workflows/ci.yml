# Quality gate: lint, types, tests, infra static checks. Runs on every pull request and is reused by deploy.yml.
# Deliberately has NO cloud credentials, so it is safe to run for pull requests from forks.
name: ci
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DYNAMODB_ENDPOINT: http://localhost:8000

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.x
      - run: tofu fmt -check -recursive infra
      - name: Security scan
        run: docker run --rm -v "$PWD/infra:/infra" ghcr.io/aquasecurity/trivy:latest config --severity HIGH,CRITICAL --exit-code 1 /infra
