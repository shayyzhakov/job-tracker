# Dormant until the project lives in a GitHub repository with `infra/bootstrap` applied using
# `-var github_repo=<owner>/<repo>`; then set the repository variable AWS_DEPLOY_ROLE_ARN.
name: infra-plan
on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra-plan.yml"]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile && scripts/build-lambda.sh # the plan reads the bundles
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.x
      - name: Format and static checks
        run: |
          tofu fmt -check -recursive infra
          docker run --rm -v "$PWD/infra:/infra" ghcr.io/aquasecurity/trivy:latest config --severity HIGH,CRITICAL --exit-code 1 /infra
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Plan
        working-directory: infra/envs/prod
        run: |
          tofu init -input=false \
            -backend-config="bucket=job-tracker-tfstate-$(aws sts get-caller-identity --query Account --output text)-us-east-1" \
            -backend-config="region=us-east-1"
          tofu validate
          tofu plan -input=false -lock-timeout=60s -var "owner_email=${{ vars.OWNER_EMAIL }}" -no-color | tee plan.txt
      - name: Comment plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/envs/prod/plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: '### OpenTofu plan\n```\n' + plan + '\n```',
            });
